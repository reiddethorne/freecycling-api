spring.application.name=freecycling
server.port=8080
spring.datasource.url=${TEST_DATABASE_URL:jdbc:mysql://localhost:3306/freecycling?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${TEST_DATABASE_USERNAME:freecycling}
spring.datasource.password=${TEST_DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
app.security.password-pepper=${TEST_PASSWORD_PEPPER:test-only-pepper}
app.security.jwt-secret=${TEST_JWT_SECRET:test-only-jwt-secret-must-be-at-least-32-characters}
